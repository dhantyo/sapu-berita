name: Canary

# Daily live check: if a site redesigns and a rule stops matching, this job fails and GitHub emails you.
on:
  schedule:
    - cron: '0 23 * * *' # 06:00 WIB
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import:autoallpage
      - run: npm run import:adblock
      - run: npm run canary
