name: Artikel rusak / Broken article
description: Artikel tampil aneh, terpotong, atau masih ada iklan / "Baca Juga".
labels: ["artikel rusak"]
body:
  - type: input
    id: url
    attributes:
      label: Tautan artikel / Article link
      placeholder: https://news.detik.com/berita/d-...
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Dipakai di / Used on
      options:
        - Android
        - iPhone / iPad (Pintasan)
        - Mac (Pintasan)
        - Ekstensi browser (Chrome, Brave, Edge)
    validations:
      required: true
  - type: checkboxes
    id: what
    attributes:
      label: Apa yang salah? / What's wrong?
      options:
        - label: Sapu Berita tidak muncul sama sekali
        - label: Sebagian teks artikel hilang
        - label: Masih ada iklan, "Baca Juga", atau tautan lain di tengah artikel
        - label: Halaman 2, 3, dst. tidak tergabung
        - label: Foto atau video hilang
        - label: Tampilan berantakan
  - type: textarea
    id: details
    attributes:
      label: Keterangan / Details
      description: Tangkapan layar sangat membantu. Versi Sapu Berita ada di bawah panel Aa.
