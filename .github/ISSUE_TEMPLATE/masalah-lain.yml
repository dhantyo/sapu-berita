name: Masalah lain / Other problem
description: Masalah pemasangan, pengaturan, atau hal lain.
body:
  - type: dropdown
    id: device
    attributes:
      label: Dipakai di / Used on
      options:
        - Android
        - iPhone / iPad (Pintasan)
        - Mac (Pintasan)
        - Ekstensi browser (Chrome, Brave, Edge)
        - Lainnya
  - type: textarea
    id: details
    attributes:
      label: Ceritakan masalahnya / What happened
      description: Apa yang kamu lakukan, apa yang terjadi, dan apa yang seharusnya terjadi.
    validations:
      required: true
