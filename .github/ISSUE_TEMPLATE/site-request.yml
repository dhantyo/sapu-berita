name: Suggest a site
description: Ask Sapu Berita to support another news site.
labels: ["site request"]
body:
  - type: input
    id: site
    attributes:
      label: Site
      placeholder: kumparan.com
    validations:
      required: true
  - type: textarea
    id: samples
    attributes:
      label: 2 or 3 article links
      description: Even better if one of them is split over several pages.
    validations:
      required: true
